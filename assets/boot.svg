ass="m">[</text><text x="42" y="291" font-size="13.5" class="g" font-weight="700" xml:space="preserve">  OK  </text><text x="93" y="291" font-size="13.5" class="m">]</text><text x="112" y="291" font-size="13.5" class="d">[    0.102300]</text><text x="240" y="291" font-size="13.5" class="t">backend: architect · FastAPI · Postgres HA · RabbitMQ · ClickHouse · LangGraph</text></g><g class="in" style="animation-delay:2.70s"><text x="34" y="316" font-size="13.5" class="m">[ ···· ]</text><text x="112" y="316" font-size="13.5" class="d">[    0.224001]</text><text x="240" y="316" font-size="13.5" class="y">Run /sbin/magic as init process</text></g><g class="in" style="animation-delay:2.86s"><text x="34" y="349" font-size="14.5"><tspan class="g">magic@phone</tspan><tspan class="m">:</tspan><tspan class="b">~</tspan><tspan class="m">$ </tspan><tspan class="t"><tspan class="in" style="animation-delay:3.16s">w</tspan><tspan class="in" style="animation-delay:3.25s">h</tspan><tspan class="in" style="animation-delay:3.34s">o</tspan><tspan class="in" style="animation-delay:3.43s">a</tspan><tspan class="in" style="animation-delay:3.52s">m</tspan><tspan class="in" style="animation-delay:3.61s">i</tspan></tspan></text></g><g class="in" style="animation-delay:4.05s"><text x="34" y="374" font-size="14.5" class="y">someone who makes hardware-shaped problems run in userspace.</text><rect x="568" y="361" width="9" height="17" class="t blink"/></g>
