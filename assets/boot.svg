<text x="500.0" y="21.5" text-anchor="middle" font-size="12" class="m">dmesg  ·  zalexdev@aarch64</text><g class="in" style="animation-delay:0.35s"><text x="34" y="66" font-size="13.5" class="m">[ ···· ]</text><text x="112" y="66" font-size="13.5" class="d">[    0.000000]</text><text x="240" y="66" font-size="13.5" class="t">Linux version 7.2-zalexdev (ARCH=um SUBARCH=arm64) — booting as a user process</text></g><g class="in" style="animation-delay:0.51s"><text x="34" y="91" font-size="13.5" class="m">[ ···· ]</text><text x="112" y="91" font-size="13.5" class="d">[    0.003117]</text><text x="240" y="91" font-size="13.5" class="t">cpu0: Ukrainian 🇺🇦 · fluent in C, Java, Kotlin, Python</text></g><g class="in" style="animation-delay:0.92s"><text x="34" y="116" font-size="13.5" class="m">[</text><text x="42" y="116" font-size="13.5" class="g" font-weight="700" xml:space="preserve">  OK  </text><text x="93" y="116" font-size="13.5" class="m">]</text><text x="112" y="116" font-size="13.5" class="d">[    0.017702]</text><text x="240" y="116" font-size="13.5" class="t">stryker: rooted-Android pentest suite · 150K+ installs · nmap/msf/BLE/HID on-device</text></g><g class="in" style="animation-delay:1.08s"><text x="34" y="141" font-size="13.5" class="m">[</text><text x="42" y="141" font-size="13.5" class="g" font-weight="700" xml:space="preserve">  OK  </text><text x="93" y="141" font-size="13.5" class="m">]</text><text x="112" y="141" font-size="13.5" class="d">[    0.031000]</text><text x="240" y="141" font-size="13.5" class="t">stryker: open-sourced under GPLv3 — free, community-driven</text></g><g class="in" style="animation-delay:1.49s"><text x="34" y="166" font-size="13.5" class="m">[</text><text x="42" y="166" font-size="13.5" class="g" font-weight="700" xml:space="preserve">  OK  </text><text x="93" y="166" font-size="13.5" class="m">]</text><text x="112" y="166" font-size="13.5" class="d">[    0.064400]</text><text x="240" y="166" font-size="13.5" class="t">um-arm64